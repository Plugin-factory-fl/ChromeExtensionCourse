services:
  - type: web
    name: chromeextensioncourse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # Free tier cold starts can take 60–90s; set the same in Dashboard → Health Checks.
    healthCheckGracePeriodSeconds: 120
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_URL
        value: https://plugin-factory-fl.github.io/ChromeExtensionCourse
      - key: PUBLIC_API_URL
        value: https://chromeextensioncourse.onrender.com

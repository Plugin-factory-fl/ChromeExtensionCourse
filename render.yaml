services:
  - type: web
    name: chromeextensioncourse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    healthCheckGracePeriodSeconds: 120
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_URL
        value: https://plugin-factory-fl.github.io/ChromeExtensionCourse
      - key: PUBLIC_API_URL
        value: https://chromeextensioncourse.onrender.com
